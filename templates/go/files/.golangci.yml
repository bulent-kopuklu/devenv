version: "2"
linters:
  default: standard
  enable:
    - errorlint
    - gochecksumtype
    - bodyclose
    - rowserrcheck
    - sqlclosecheck
    - noctx
    - funlen
    - gocognit
  settings:
    funlen:
      lines: 80
      statements: -1
    gocognit:
      min-complexity: 30
    errcheck:
      check-type-assertions: true
    gochecksumtype:
      default-signifies-exhaustive: false
  exclusions:
    rules:
      - path: _test\.go
        linters:
          - funlen
          - gocognit
formatters:
  enable:
    - gofmt
    - goimports
