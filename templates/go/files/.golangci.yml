version: "2"
linters:
  default: standard
  enable:
    - errorlint
    - gochecksumtype
    - bodyclose
    - rowserrcheck
    - sqlclosecheck
    - noctx
  settings:
    errcheck:
      check-type-assertions: true
    gochecksumtype:
      default-signifies-exhaustive: false
formatters:
  enable:
    - gofmt
    - goimports
